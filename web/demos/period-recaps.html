<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Итоги · Арена</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #101114;
        --surface: #191b20;
        --border: #303339;
        --text: #f0f1f4;
        --muted: #a6abb6;
        --accent: #42a5ff;
        font: 15px/1.45 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    main {
        max-width: 860px;
        margin: auto;
        padding: clamp(28px, 8vw, 88px) 20px;
    }

    .brand, .period { color: var(--muted); font-size: .87rem; }
    .brand { letter-spacing: .2em; font-weight: 750; text-transform: uppercase; }
    h1, h2, p, dl, dd { margin: 0; }
    h1 { margin: 14px 0 6px; font-size: clamp(36px, 7vw, 64px); letter-spacing: -.065em; line-height: 1; }
    .intro { color: var(--muted); }
    .choices { display: grid; gap: 12px; margin-top: 30px; }

    .choice {
        display: grid;
        gap: 6px;
        position: relative;
        padding: 19px 42px 19px 19px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: left;
    }

    .choice:hover { border-color: var(--accent); }
    .choice strong { font-size: 1.12rem; }
    .choice span { color: var(--muted); font-size: .87rem; }
    .choice::after { content: '↗'; position: absolute; right: 18px; top: 18px; color: var(--accent); }
    [data-period="season"] { --accent: #35df91; }
    [data-period="year"] { --accent: #ffd04a; }

    /* Recap dialog start */
    #period-recap {
        width: min(460px, calc(100% - 24px));
        max-height: calc(100dvh - 24px);
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 24px;
        color: var(--text);
        background: var(--surface);
        box-shadow: 0 24px 80px #000a;
        scrollbar-width: thin;
    }

    #period-recap::backdrop { background: #08090de0; }
    .recap { position: relative; touch-action: pan-y pinch-zoom; padding: clamp(16px, 5vw, 26px); }
    header { padding-right: 46px; }
    h2 { font-size: clamp(24px, 7vw, 34px); letter-spacing: -.045em; line-height: 1.12; margin-top: 5px; }
    #recap-title:focus { outline: none; }
    .close:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--accent);
    }
    .close {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 44px;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        font-size: 24px;
        line-height: 1;
    }

    .hero {
        margin-top: 20px;
        padding: 17px;
        border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--border));
        border-radius: 16px;
        background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 12%, var(--bg)), var(--bg));
    }

    .hero-label, dt { color: var(--muted); font-size: .87rem; }
    .hero-value {
        color: var(--accent);
        font-size: clamp(42px, 12vw, 62px);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -.065em;
        line-height: 1.12;
        margin: 3px 0 8px;
    }

    progress { display: block; width: 100%; height: 8px; accent-color: var(--accent); }
    .hero-note { margin-top: 8px; font-size: .9rem; }
    .metrics { margin: 12px 0 18px; }
    .metrics div {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
    }

    dd { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .done {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--bg);
        font-weight: 750;
    }

    .close:hover, .done:hover { filter: brightness(1.15); }

    /* Recap dialog end */

    @media (min-width: 660px) {
        .choices { grid-template-columns: repeat(3, 1fr); }
    }
</style>
</head>
<body>
<main>
    <p class="brand">Арена</p>
    <h1>Итоги</h1>
    <p class="intro">Выберите период, чтобы открыть карточку с примером результатов.</p>
    <div class="choices">
        <button class="choice" type="button" data-recap data-period="week"><strong>Итоги недели</strong><span>23–29 ноября 2026</span></button>
        <button class="choice" type="button" data-recap data-period="season"><strong>Итоги сезона</strong><span>Сентябрь — ноябрь 2026</span></button>
        <button class="choice" type="button" data-recap data-period="year"><strong>Итоги года</strong><span>2026/27 учебный год</span></button>
    </div>
</main>

<dialog id="period-recap" aria-labelledby="recap-title">
    <form class="recap" method="dialog">
        <header>
            <p class="period"></p>
            <h2 id="recap-title" tabindex="-1" autofocus aria-live="polite"></h2>
        </header>
        <button class="close" value="close" aria-label="Закрыть">×</button>
        <section class="hero" aria-labelledby="hero-label">
            <p class="hero-label" id="hero-label"></p>
            <p class="hero-value"></p>
            <progress max="100" aria-labelledby="hero-label"></progress>
            <p class="hero-note"></p>
        </section>
        <dl class="metrics"></dl>
        <button class="done" value="done">Готово</button>
    </form>
</dialog>

<script>
    const recaps = {
        week: {
            title: 'Итоги недели',
            label: 'Решено за неделю',
            value: '32 / 25',
            percent: 100,
            note: 'На 7 задач больше недельной цели',
            metrics: [
                ['Изучено заданий', '+2'],
                ['Место в рейтинге недели', '2-е'],
            ],
        },
        season: {
            title: 'Итоги сезона',
            label: 'Ноябрьская цель',
            value: '98%',
            percent: 98,
            note: 'Изменения с начала учебного года',
            metrics: [
                ['Решено задач', '348 из 321'],
                ['Изучено заданий', '15 из 16'],
                ['Балл пробника', '42 → 67'],
            ],
        },
        year: {
            title: 'Итоги года',
            label: 'Общий прогресс',
            value: '97%',
            percent: 97,
            note: 'С 1 сентября 2026 по 31 мая 2027',
            metrics: [
                ['Решено задач', '926 из 900'],
                ['Изучено заданий', '26 из 27'],
                ['Балл пробника', '42 → 94'],
            ],
        },
    };

    const dialog = document.getElementById('period-recap');

    const periods = ['week', 'season', 'year'];
    let gesture = null;
    let keepKeyboardFocus = false;

    function showRecap(choice) {
        const period = choice.dataset.period;
        const recap = recaps[period];
        dialog.dataset.period = period;
        dialog.querySelector('h2').textContent = recap.title;
        dialog.querySelector('.period').textContent = choice.querySelector('span').textContent;
        dialog.querySelector('.hero-label').textContent = recap.label;
        dialog.querySelector('.hero-value').textContent = recap.value;
        dialog.querySelector('progress').value = recap.percent;
        dialog.querySelector('.hero-note').textContent = recap.note;
        dialog.querySelector('.metrics').replaceChildren(...recap.metrics.map(([label, value]) => {
            const row = document.createElement('div');
            const term = document.createElement('dt');
            const detail = document.createElement('dd');
            term.textContent = label;
            detail.textContent = value;
            row.append(term, detail);
            return row;
        }));
        if (dialog.open) dialog.scrollTop = 0;
        else dialog.showModal();
    }

    function step(direction) {
        const index = periods.indexOf(dialog.dataset.period);
        const period = periods[(index + direction + periods.length) % periods.length];
        const choice = document.querySelector(`button[data-recap][data-period="${period}"]`);
        if (choice) showRecap(choice);
    }

    document.addEventListener('click', (event) => {
        const choice = event.target.closest('button[data-recap]');
        if (choice) {
            keepKeyboardFocus = event.detail === 0;
            showRecap(choice);
        }
    });

    dialog.addEventListener('pointerdown', (event) => {
        if (!event.isPrimary || event.pointerType === 'mouse' ||
            !event.target.closest('form') || event.target.closest('button')) return;
        gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
    });
    dialog.addEventListener('pointercancel', (event) => {
        if (gesture?.id === event.pointerId) gesture = null;
    });
    dialog.addEventListener('pointerup', (event) => {
        if (gesture?.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x;
        const dy = event.clientY - gesture.y;
        gesture = null;
        if (Math.abs(dx) >= 45 && Math.abs(dx) > Math.abs(dy) * 1.25) step(dx < 0 ? 1 : -1);
    });
    dialog.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        step(event.key === 'ArrowRight' ? 1 : -1);
    });
    dialog.addEventListener('close', () => {
        const focused = document.activeElement;
        if (!keepKeyboardFocus && focused?.closest('.swipe-card-track')) focused.blur();
        keepKeyboardFocus = false;
        gesture = null;
    });

    dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
    });
</script>
</body>
</html>
